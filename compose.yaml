services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - forgejo-data:/data

volumes:
  forgejo-data:
    name: forgejo-data
